<script>
  function formatISODate(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    return d.toISOString().split("T")[0];
  }

  function startOfWeek(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = (day + 6) % 7;
    d.setDate(d.getDate() - diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function endOfWeek(date) {
    const d = new Date(date);
    d.setDate(d.getDate() + 6);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function addDays(date, amount) {
    const d = new Date(date);
    d.setDate(d.getDate() + amount);
    return d;
  }

  const initialWeekStart = startOfWeek(new Date());
  const initialWeekEnd = endOfWeek(initialWeekStart);

  const TEMP_TASK_PREFIX = "temp-task-";

  const state = {
    panel: "dashboard",
    weekStart: initialWeekStart,
    weekEnd: initialWeekEnd,
    selectedDate: formatISODate(initialWeekStart),
    kanbanFilter: "week",
    kanbanSelectedDate: formatISODate(new Date()),
    taskSearch: "",
    taskPage: 1,
    taskPageSize: 10,
    tasks: [],
    calendar: [],
    finance: [],
  };

  document.addEventListener("DOMContentLoaded", () => {
    setupNav();
    setupSidebarControls();
    setupKanbanFilter();
    setupForms();
    initKanbanDroppers();
    setFormDefaults();
    refreshTasks();
    refreshFinance();
  });

  function setupNav() {
    document.querySelectorAll("nav a[data-panel]").forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        setPanel(link.dataset.panel);
      });
    });
  }

  function setupSidebarControls() {
    const sidebar = document.querySelector(".sidebar");
    if (!sidebar) return;
    const savedTheme = localStorage.getItem("ui-theme") || "light";
    setTheme(savedTheme);
    document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        setTheme(button.dataset.themeToggle);
      });
    });
    const toggle = document.getElementById("sidebarToggle");
    const storedCollapsed = localStorage.getItem("sidebar-collapsed") === "true";
    setSidebarCollapsed(storedCollapsed);
    toggle?.addEventListener("click", () => {
      setSidebarCollapsed(!sidebar.classList.contains("collapsed"));
    });
  }

  function setTheme(theme) {
    document.body.dataset.theme = theme;
    localStorage.setItem("ui-theme", theme);
    document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
      button.classList.toggle("active", button.dataset.themeToggle === theme);
      button.setAttribute("aria-pressed", button.dataset.themeToggle === theme);
    });
  }

  function setSidebarCollapsed(collapsed) {
    const sidebar = document.querySelector(".sidebar");
    if (!sidebar) return;
    sidebar.classList.toggle("collapsed", collapsed);
    localStorage.setItem("sidebar-collapsed", String(collapsed));
    const toggle = document.getElementById("sidebarToggle");
    if (toggle) {
      const icon = toggle.querySelector(".sidebar-toggle-icon");
      const label = toggle.querySelector(".sidebar-label");
      if (icon) icon.textContent = collapsed ? "⇥" : "⇤";
      if (label) label.textContent = collapsed ? "Expand" : "Collapse";
    }
  }

  function setPanel(panel) {
    state.panel = panel;
    document.querySelectorAll("nav a[data-panel]").forEach((link) => {
      link.classList.toggle("active", link.dataset.panel === panel);
    });
    document.querySelectorAll(".panel").forEach((section) => {
      section.classList.toggle("active", section.dataset.panel === panel);
    });
  }

  function setupForms() {

    const taskForm = document.getElementById("taskForm");
    taskForm?.addEventListener("submit", (event) => {
      event.preventDefault();
      const payload = {
        title: taskForm.title.value,
        category: taskForm.category.value,
        description: taskForm.description.value,
        date: taskForm.date.value,
        startTime: taskForm.start.value,
        endTime: taskForm.end.value,
      };
      const recurrence = taskForm.recurrence.value;
      const occurrences = Number(taskForm.occurrences.value || 1);
      const finishStatus = startStatusAction("taskStatus", "Saving…");
      const isRecurring = recurrence && recurrence !== "none" && occurrences > 1;
      let localTask = null;
      if (!isRecurring) {
        localTask = addLocalTask(buildLocalTaskFromPayload(payload));
      }
      const runner = google.script.run
        .withSuccessHandler((result) => {
          finishStatus("Task saved.");
          taskForm.reset();
          taskForm.date.value = state.selectedDate;
          if (localTask && result?.taskId) {
            localTask.id = String(result.taskId);
          }
          if (isRecurring || !localTask) {
            refreshTasks();
          }
        })
        .withFailureHandler((error) => {
          finishStatus(error.message || "Unable to save task", true);
          if (localTask) {
            removeLocalTaskById(localTask.id);
          } else {
            refreshTasks();
          }
        });
      if (recurrence && recurrence !== "none") {
        runner.scheduleRecurringTasks({
          ...payload,
          frequency: recurrence,
          occurrences,
        });
      } else {
        runner.scheduleTask(payload);
      }
    });

    const financeForm = document.getElementById("financeForm");
    financeForm?.addEventListener("submit", (event) => {
      event.preventDefault();
      const payload = {
        date: financeForm.date.value,
        type: financeForm.type.value,
        category: financeForm.category.value,
        description: financeForm.description.value,
        amount: financeForm.amount.value,
      };
      const finishStatus = startStatusAction("financeStatus", "Saving entry…");
      google.script.run
        .withSuccessHandler(() => {
          finishStatus("Entry logged.");
          financeForm.reset();
          refreshFinance();
        })
        .withFailureHandler((error) =>
          finishStatus(error.message || "Unable to save entry", true)
        )
        .addFinanceEntry(payload);
    });
  }

  function setupKanbanFilter() {
    const filter = document.getElementById("kanbanFilter");
    const dateLabel = document.getElementById("kanbanDateLabel");
    const dateInput = document.getElementById("kanbanDateFilter");
    
    if (!filter) return;
    filter.value = state.kanbanFilter;
    
    // Set initial date value to today
    if (dateInput) {
      dateInput.value = state.kanbanSelectedDate || formatISODate(new Date());
      state.kanbanSelectedDate = dateInput.value;
    }
    
    // Show/hide date input based on filter selection
    const updateDateVisibility = () => {
      if (dateLabel) {
        if (state.kanbanFilter === "day") {
          dateLabel.style.display = "flex";
        } else {
          dateLabel.style.display = "none";
        }
      }
    };
    
    filter.addEventListener("change", (event) => {
      state.kanbanFilter = event.target.value || "week";
      updateDateVisibility();
      renderKanban();
    });
    
    // Handle date changes
    if (dateInput) {
      dateInput.addEventListener("change", (event) => {
        const value = event.target.value;
        if (value) {
          state.kanbanSelectedDate = value;
          // Check if the selected date is outside the current week range
          const selectedDate = new Date(value);
          const weekStart = new Date(state.weekStart);
          const weekEnd = new Date(state.weekEnd);
          if (selectedDate < weekStart || selectedDate > weekEnd) {
            // Update week range to include the selected date
            state.weekStart = startOfWeek(selectedDate);
            state.weekEnd = endOfWeek(state.weekStart);
            // Reload tasks for the new week range
            refreshTasks();
          } else {
            // Just update the kanban view
            renderKanban();
          }
        }
      });
    }
    
    // Initial visibility
    updateDateVisibility();
  }


  function populateWeekSelector() {
    const select = document.getElementById("weekSelector");
    if (!select) return;
    
    // Get the current week start
    const currentWeekStart = formatISODate(state.weekStart);
    
    // Build options for -1, 0, +1 weeks from today
    const baseOptions = [-1, 0, 1].map((offset) => {
      const base = addDays(new Date(), offset * 7);
      const start = startOfWeek(base);
      const end = endOfWeek(start);
      return {
        value: formatISODate(start),
        label: `${start.toLocaleDateString()} - ${end.toLocaleDateString()}`,
      };
    });
    
    // Check if current week is already in the options
    const hasCurrentWeek = baseOptions.some(opt => opt.value === currentWeekStart);
    
    // If current week is not in the default options, add it
    if (!hasCurrentWeek) {
      const currentStart = state.weekStart;
      const currentEnd = state.weekEnd;
      baseOptions.push({
        value: formatISODate(currentStart),
        label: `${currentStart.toLocaleDateString()} - ${currentEnd.toLocaleDateString()}`,
      });
      // Sort by date
      baseOptions.sort((a, b) => a.value.localeCompare(b.value));
    }
    
    const currentValue = select.value;
    select.innerHTML = baseOptions
      .map(
        (opt) => `<option value="${opt.value}">${offsetLabel(opt.value, opt.label)}</option>`
      )
      .join("");
    // Restore or set the value
    select.value = currentWeekStart;
  }
  
  function setupWeekSelector() {
    const select = document.getElementById("weekSelector");
    if (!select) return;
    select.addEventListener("change", (event) => {
      const start = startOfWeek(new Date(event.target.value));
      setWeekRange(start);
    });
  }

  function offsetLabel(value, label) {
    const current = formatISODate(state.weekStart);
    if (value === current) return `This week (${label})`;
    const nextWeek = formatISODate(addDays(state.weekStart, 7));
    const prevWeek = formatISODate(addDays(state.weekStart, -7));
    if (value === nextWeek) return `Next week (${label})`;
    if (value === prevWeek) return `Last week (${label})`;
    return label;
  }

  function setWeekRange(startDate) {
    state.weekStart = startOfWeek(startDate);
    state.weekEnd = endOfWeek(state.weekStart);
    const selector = document.getElementById("weekSelector");
    if (selector) selector.value = formatISODate(state.weekStart);
    const currentSelected = new Date(state.selectedDate);
    const weekStartDate = new Date(state.weekStart);
    const weekEndDate = new Date(state.weekEnd);
    if (currentSelected < weekStartDate || currentSelected > weekEndDate) {
      updateSelectedDate(formatISODate(state.weekStart));
    } else {
      updateDateDisplay();
      updateQuickSelectButtons();
    }
    refreshTasks();
    refreshFinance();
  }

  function updateSelectedDate(dateString) {
    if (!dateString) return;
    // Normalize the date string to YYYY-MM-DD format
    const normalized = dateKey(dateString) || formatISODate(new Date(dateString));
    if (!normalized) return;
    
    const selectedDate = new Date(normalized);
    const weekStartDate = new Date(state.weekStart);
    const weekEndDate = new Date(state.weekEnd);
    
    // Check if selected date is outside the current week range
    const isOutsideWeek = selectedDate < weekStartDate || selectedDate > weekEndDate;
    
    state.selectedDate = normalized;
    const dateFilter = document.getElementById("taskDateFilter");
    if (dateFilter && dateFilter.value !== normalized) {
      dateFilter.value = normalized;
    }
    
    // If the selected date is outside the current week, adjust the week range
    if (isOutsideWeek) {
      const newWeekStart = startOfWeek(selectedDate);
      state.weekStart = newWeekStart;
      state.weekEnd = endOfWeek(newWeekStart);
      const selector = document.getElementById("weekSelector");
      if (selector) {
        // Update week selector to show the new week
        populateWeekSelector();
        selector.value = formatISODate(state.weekStart);
      }
      // Reload tasks for the new week range
      refreshTasks();
    }
    
    updateDateDisplay();
    updateQuickSelectButtons();
    setFormDefaults();
    renderKanban();
    state.taskPage = 1;
    renderTasks();
  }

  function setupDateNavigation() {
    const prevBtn = document.getElementById("datePrevBtn");
    const nextBtn = document.getElementById("dateNextBtn");
    if (prevBtn) {
      prevBtn.addEventListener("click", () => {
        const current = new Date(state.selectedDate);
        const prev = addDays(current, -1);
        updateSelectedDate(formatISODate(prev));
      });
    }
    if (nextBtn) {
      nextBtn.addEventListener("click", () => {
        const current = new Date(state.selectedDate);
        const next = addDays(current, 1);
        updateSelectedDate(formatISODate(next));
      });
    }
  }

  function setupDateQuickSelect() {
    document.querySelectorAll(".date-quick-btn[data-date-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.dateAction;
        let targetDate = null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        switch (action) {
          case "today":
            targetDate = today;
            break;
          case "tomorrow":
            targetDate = addDays(today, 1);
            break;
          case "yesterday":
            targetDate = addDays(today, -1);
            break;
          case "week-start":
            targetDate = state.weekStart;
            break;
          case "week-end":
            targetDate = state.weekEnd;
            break;
        }
        if (targetDate) {
          updateSelectedDate(formatISODate(targetDate));
        }
      });
    });
    updateQuickSelectButtons();
  }

  function updateQuickSelectButtons() {
    const today = formatISODate(new Date());
    const tomorrow = formatISODate(addDays(new Date(), 1));
    const yesterday = formatISODate(addDays(new Date(), -1));
    const weekStart = formatISODate(state.weekStart);
    const weekEnd = formatISODate(state.weekEnd);
    const selected = state.selectedDate;

    document.querySelectorAll(".date-quick-btn[data-date-action]").forEach((btn) => {
      const action = btn.dataset.dateAction;
      let isActive = false;
      switch (action) {
        case "today":
          isActive = selected === today;
          break;
        case "tomorrow":
          isActive = selected === tomorrow;
          break;
        case "yesterday":
          isActive = selected === yesterday;
          break;
        case "week-start":
          isActive = selected === weekStart;
          break;
        case "week-end":
          isActive = selected === weekEnd;
          break;
      }
      btn.classList.toggle("active", isActive);
    });
  }

  function setupDateKeyboardShortcuts() {
    document.addEventListener("keydown", (event) => {
      const dateFilter = document.getElementById("taskDateFilter");
      if (!dateFilter) return;
      if (event.target === dateFilter || event.target.closest(".date-nav-btn") || event.target.closest(".date-quick-btn")) {
        if (event.key === "ArrowLeft" && !event.shiftKey && !event.ctrlKey && !event.metaKey) {
          event.preventDefault();
          const current = new Date(state.selectedDate);
          const prev = addDays(current, -1);
          updateSelectedDate(formatISODate(prev));
        } else if (event.key === "ArrowRight" && !event.shiftKey && !event.ctrlKey && !event.metaKey) {
          event.preventDefault();
          const current = new Date(state.selectedDate);
          const next = addDays(current, 1);
          updateSelectedDate(formatISODate(next));
        }
      }
    });
  }

  function formatDateDisplay(dateString) {
    if (!dateString) return "";
    const date = new Date(dateString);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const selected = new Date(date);
    selected.setHours(0, 0, 0, 0);
    const diffDays = Math.round((selected - today) / (1000 * 60 * 60 * 24));
    const dayOfWeek = date.toLocaleDateString([], { weekday: "short" });
    const monthDay = date.toLocaleDateString([], { month: "short", day: "numeric" });
    let relativeLabel = "";
    if (diffDays === 0) {
      relativeLabel = "Today";
    } else if (diffDays === 1) {
      relativeLabel = "Tomorrow";
    } else if (diffDays === -1) {
      relativeLabel = "Yesterday";
    } else if (diffDays > 1 && diffDays <= 7) {
      relativeLabel = `In ${diffDays} days`;
    } else if (diffDays < -1 && diffDays >= -7) {
      relativeLabel = `${Math.abs(diffDays)} days ago`;
    }
    const display = document.getElementById("dateDisplay");
    if (display) {
      display.classList.toggle("font-semibold", diffDays === 0);
      display.classList.toggle("text-indigo-600", diffDays === 0);
      if (document.body.dataset.theme === "dark" && diffDays === 0) {
        display.classList.add("text-indigo-400");
      }
    }
    return relativeLabel ? `${dayOfWeek}, ${monthDay} (${relativeLabel})` : `${dayOfWeek}, ${monthDay}`;
  }

  function updateDateDisplay() {
    const display = document.getElementById("dateDisplay");
    if (display) {
      display.textContent = formatDateDisplay(state.selectedDate);
    }
  }

  function setFormDefaults() {
    const taskForm = document.getElementById("taskForm");
    if (taskForm && !taskForm.date.value) {
      taskForm.date.value = state.selectedDate;
    }
    const financeForm = document.getElementById("financeForm");
    if (financeForm && !financeForm.date.value) {
      financeForm.date.value = formatISODate(new Date());
    }
  }

  function initKanbanDroppers() {
    const columns = document.querySelectorAll(".kanban-column");
    const prevent = (evt) => evt.preventDefault();
    columns.forEach((column) => {
      const list = column.querySelector(".kanban-list");
      const handleDrop = (evt) => {
        evt.preventDefault();
        const id = evt.dataTransfer?.getData("text/plain");
        if (!id) return;
        const newStatus = column.dataset.status;
        const change = applyTaskStatusLocally(id, newStatus);
        if (!change.shouldSync) return;
        const finishStatus = startStatusAction("taskStatus", `Updating to ${newStatus}…`);
        google.script.run
          .withSuccessHandler(() => finishStatus(`Moved to ${newStatus}.`))
          .withFailureHandler((error) => {
            change.rollback();
            finishStatus(error.message || "Unable to update task", true);
          })
          .updateTaskStatus({ id, status: newStatus, sheetName: "Tasks" });
      };
      column.addEventListener("dragover", prevent);
      column.addEventListener("drop", handleDrop);
      list?.addEventListener("dragover", prevent);
      list?.addEventListener("drop", handleDrop);
    });
  }

  function enableKanbanDrag() {
    document.querySelectorAll(".kanban-card").forEach((card) => {
      card.addEventListener("dragstart", (evt) => {
        evt.dataTransfer.setData("text/plain", card.dataset.id);
        card.classList.add("dragging");
        const rect = card.getBoundingClientRect();
        const offsetX = rect.width / 2;
        const offsetY = rect.height / 2;
        if (evt.dataTransfer.setDragImage) {
          evt.dataTransfer.setDragImage(card, offsetX, offsetY);
        }
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
      });
      card.querySelectorAll(".calendar-link").forEach((link) => {
        link.addEventListener("mousedown", (evt) => evt.stopPropagation());
        link.addEventListener("click", (evt) => evt.stopPropagation());
      });
    });
  }

  function refreshTasks() {
    const start = formatISODate(state.weekStart);
    const end = formatISODate(state.weekEnd);
    google.script.run
      .withSuccessHandler((raw) => {
        state.tasks = parseJson(raw).sort(sortTasksByStart);
        renderTasks();
        renderKanban();
        updateDashboard();
      })
      .withFailureHandler((error) => setStatus("taskStatus", error.message || "Unable to load tasks", true))
      .getScheduledTasksInRange({ startDate: start, endDate: end });

    google.script.run
      .withSuccessHandler((raw) => {
        state.calendar = parseJson(raw);
        renderCalendar();
        updateDashboard();
      })
      .withFailureHandler((error) => setStatus("taskStatus", error.message || "Unable to load calendar", true))
      .getCalendarEventsForRange({ startDate: start, endDate: end });
  }

  function refreshFinance() {
    google.script.run
      .withSuccessHandler((raw) => {
        const entries = parseJson(raw);
        state.finance = filterEntriesByWeek(entries);
        renderFinance();
        updateDashboard();
      })
      .withFailureHandler((error) =>
        setStatus("financeStatus", error.message || "Unable to load entries", true)
      )
      .getFinanceEntries();
  }

  function filterEntriesByWeek(entries) {
    const startKey = formatISODate(state.weekStart);
    const endKey = formatISODate(state.weekEnd);
    return entries.filter((entry) => {
      const entryDate = dateKey(entry.date);
      if (!entryDate) return false;
      return entryDate >= startKey && entryDate <= endKey;
    });
  }

  function dateKey(value) {
    if (!value) return "";
    const stringValue = String(value).trim();
    if (!stringValue) return "";
    // Handle ISO date strings like "2026-01-12T01:53:00.000Z" or "2026-01-12T01:53:00"
    if (/^\d{4}-\d{2}-\d{2}/.test(stringValue)) {
      return stringValue.slice(0, 10);
    }
    // Handle Date objects
    if (value instanceof Date) {
      return formatISODate(value);
    }
    // Try parsing as date
    const parsed = new Date(stringValue);
    if (isNaN(parsed.getTime())) return "";
    return formatISODate(parsed);
  }

  function renderTasks() {
    const tbody = document.getElementById("taskTableBody");
    if (!tbody) return;
    const filteredTasks = filterTaskTable(state.tasks);
    const pagination = paginateTasks(filteredTasks);
    if (!pagination.items.length) {
      tbody.innerHTML = `<tr><td colspan="4">No tasks for this view.</td></tr>`;
      renderTaskPagination(0);
      return;
    }
    tbody.innerHTML = pagination.items
      .map((task) => {
        const calendarLink = task.calendarEventId
          ? `<a class="calendar-link" href="${buildCalendarEventUrl(task.calendarEventId)}" target="_blank" rel="noopener">Calendar ↗</a>`
          : "";
        return `
        <tr>
          <td>
            <strong>${escapeHtml(task.title)}</strong>
            <div class="table-meta">${escapeHtml(task.description || "")}</div>
            ${calendarLink ? `<div class="table-meta">${calendarLink}</div>` : ""}
          </td>
          <td>${formatRange(task.start, task.end)}</td>
          <td><span class="status-chip">${escapeHtml(task.status || "Planned")}</span></td>
          <td class="align-right">
            <button type="button" class="ghost" onclick="deleteTask('${task.id}')">Delete</button>
          </td>
        </tr>`;
      })
      .join("");
    renderTaskPagination(pagination.totalPages);
  }

  function filterTaskTable(tasks) {
    // No filtering - show all tasks
    return tasks;
  }

  function paginateTasks(tasks) {
    const totalPages = Math.max(
      1,
      Math.ceil(tasks.length / state.taskPageSize)
    );
    state.taskPage = Math.min(state.taskPage, totalPages);
    const start = (state.taskPage - 1) * state.taskPageSize;
    const items = tasks.slice(start, start + state.taskPageSize);
    return { items, totalPages };
  }

  function renderTaskPagination(totalPages) {
    const container = document.getElementById("taskPagination");
    if (!container) return;
    if (totalPages <= 1) {
      container.innerHTML = "";
      return;
    }
    const pages = Array.from({ length: totalPages }, (_, i) => i + 1);
    container.innerHTML = pages
      .map((page) => {
        const isActive = page === state.taskPage;
        return `<button type="button" class="pagination-btn${isActive ? " active" : ""}" data-page="${page}">${page}</button>`;
      })
      .join("");
    container.querySelectorAll("button[data-page]").forEach((button) => {
      button.addEventListener("click", () => {
        state.taskPage = Number(button.dataset.page || 1);
        renderTasks();
      });
    });
  }

  function renderKanban() {
    const columns = {
      Planned: [],
      Running: [],
      Done: [],
    };
    const visibleTasks = filterKanbanTasks(state.tasks);
    visibleTasks.forEach((task) => {
      const status = task.status || "Planned";
      (columns[status] || columns.Planned).push(task);
    });
    Object.entries(columns).forEach(([status, items]) => {
      const container = document.getElementById(`kanban${status}`);
      if (!container) return;
      if (!items.length) {
        container.innerHTML = `<div class="kanban-empty">Drop tasks here</div>`;
        return;
      }
      container.innerHTML = items
        .map((task) => {
          const calendarLink = task.calendarEventId
            ? `<a class="calendar-link" href="${buildCalendarEventUrl(task.calendarEventId)}" target="_blank" rel="noopener">Calendar ↗</a>`
            : "";
          const category = task.category ? `<span>${escapeHtml(task.category)}</span>` : "";
          return `
        <div class="kanban-card" draggable="true" data-id="${task.id}" data-status="${status}">
          <div class="flex items-start justify-between gap-2">
            <strong>${escapeHtml(task.title)}</strong>
            ${calendarLink}
          </div>
          <div class="kanban-meta">
            <span>${formatRange(task.start, task.end)}</span>
            ${category}
          </div>
          <p class="agenda-meta">${escapeHtml(task.description || "")}</p>
          <div class="kanban-actions">
            <span class="kanban-pill">${escapeHtml(status)}</span>
            <button type="button" class="ghost" onclick="deleteTask('${task.id}')">Delete</button>
          </div>
        </div>`;
        })
        .join("");
    });
    enableKanbanDrag();
  }

  function filterKanbanTasks(tasks) {
    // When "week" mode is selected, show all tasks (already filtered by week in refreshTasks)
    if (state.kanbanFilter !== "day") {
      return tasks;
    }
    // When "day" mode is selected, filter by the selected date
    const selectedKey = dateKey(state.kanbanSelectedDate);
    if (!selectedKey) return tasks;
    return tasks.filter((task) => {
      const taskDate = task.start || task.date || task.startDate;
      const startKey = dateKey(taskDate);
      return startKey && startKey === selectedKey;
    });
  }

  function renderCalendar() {
    const list = document.getElementById("calendarList");
    if (!list) return;
    if (!state.calendar.length) {
      list.innerHTML = "<li>No calendar events this week.</li>";
      return;
    }
    list.innerHTML = state.calendar
      .map((event) => {
        const eventUrl = event.url || buildCalendarEventUrl(event.id);
        const title = eventUrl
          ? `<a class="calendar-link" href="${eventUrl}" target="_blank" rel="noopener">${escapeHtml(event.title)} ↗</a>`
          : `<strong>${escapeHtml(event.title)}</strong>`;
        return `
        <li>
          <div class="agenda-item">
            ${title}
            <span>${formatRange(event.start, event.end)}</span>
          </div>
          <p class="agenda-meta">${escapeHtml(event.location || "")}</p>
        </li>`;
      })
      .join("");
  }

  function renderFinance() {
    const tbody = document.getElementById("financeTableBody");
    if (!tbody) return;
    if (!state.finance.length) {
      tbody.innerHTML = `<tr><td colspan="6">No entries yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = state.finance
      .slice(0, 25)
      .map(
        (entry) => `
        <tr>
          <td>${escapeHtml(entry.date || "")}</td>
          <td>${escapeHtml(entry.type || "")}</td>
          <td>${escapeHtml(entry.category || "")}</td>
          <td>${escapeHtml(entry.description || "")}</td>
          <td class="align-right">${formatCurrency(entry.amount)}</td>
          <td class="align-right">
            <button type="button" class="ghost" onclick="deleteFinanceEntry('${entry.id}')">Delete</button>
          </td>
        </tr>`
      )
      .join("");
  }

  function updateDashboard() {
    document.getElementById("summaryTaskCount").textContent = state.tasks.length;
    document.getElementById("summaryCalendarCount").textContent = state.calendar.length;
    const insights = calculateFinanceInsights();
    document.getElementById("summaryIncome").textContent = formatCurrency(insights.income);
    document.getElementById("summaryExpense").textContent = formatCurrency(insights.expense);
    document.getElementById("insightIncome").textContent = formatCurrency(insights.income);
    document.getElementById("insightExpense").textContent = formatCurrency(insights.expense);
    document.getElementById("insightTopCategory").textContent = insights.topCategory || "—";
    document.getElementById("dashboardCalendar").innerHTML =
      state.calendar
        .slice(0, 5)
        .map((event) => {
          const eventUrl = event.url || buildCalendarEventUrl(event.id);
          const title = eventUrl
            ? `<a class="calendar-link" href="${eventUrl}" target="_blank" rel="noopener">${escapeHtml(event.title)} ↗</a>`
            : `<strong>${escapeHtml(event.title)}</strong>`;
          return `
          <li>
            ${title}
            <span>${formatRange(event.start, event.end)}</span>
          </li>`;
        })
        .join("") || "<li>No upcoming events.</li>";
    document.getElementById("dashboardFinance").innerHTML =
      state.finance
        .slice(0, 5)
        .map(
          (entry) => `
          <li>
            <strong>${escapeHtml(entry.category || entry.type || "")}</strong>
            <span>${formatCurrency(entry.amount)}</span>
          </li>`
        )
        .join("") || "<li>No recent entries.</li>";
  }

  function calculateFinanceInsights() {
    const totals = {};
    let income = 0;
    let expense = 0;
    state.finance.forEach((entry) => {
      const bucket = entry.type === "Income" ? "Income" : "Expense";
      const amount = Number(entry.amount || 0);
      const key = entry.category || bucket;
      totals[key] = (totals[key] || 0) + amount;
      if (bucket === "Income") income += amount;
      else expense += amount;
    });
    const topCategory = Object.entries(totals).sort((a, b) => b[1] - a[1])[0]?.[0];
    return { income, expense, topCategory };
  }

  function deleteTask(id) {
    if (!id) return;
    const normalizedId = String(id);
    const index = state.tasks.findIndex((task) => String(task.id) === normalizedId);
    let removedTask = null;
    if (index >= 0) {
      removedTask = state.tasks.splice(index, 1)[0];
      renderTasks();
      renderKanban();
      updateDashboard();
    }
    const finishStatus = startStatusAction("taskStatus", "Removing task…");
    google.script.run
      .withSuccessHandler(() => {
        finishStatus("Task removed.");
      })
      .withFailureHandler((error) => {
        if (removedTask) {
          state.tasks.splice(index, 0, removedTask);
          renderTasks();
          renderKanban();
          updateDashboard();
        }
        finishStatus(error.message || "Unable to delete task", true);
        refreshTasks();
      })
      .deleteTask({ id, sheetName: "Tasks" });
  }

  function deleteFinanceEntry(id) {
    if (!id) return;
    const normalizedId = String(id);
    const index = state.finance.findIndex((entry) => String(entry.id) === normalizedId);
    let removedEntry = null;
    if (index >= 0) {
      removedEntry = state.finance.splice(index, 1)[0];
      renderFinance();
      updateDashboard();
    }
    const finishStatus = startStatusAction("financeStatus", "Removing entry…");
    google.script.run
      .withSuccessHandler(() => {
        finishStatus("Entry deleted.");
      })
      .withFailureHandler((error) => {
        if (removedEntry) {
          state.finance.splice(index, 0, removedEntry);
          renderFinance();
          updateDashboard();
        }
        finishStatus(error.message || "Unable to delete entry", true);
        refreshFinance();
      })
      .deleteFinanceEntry(normalizedId);
  }

  function parseJson(raw, fallback = []) {
    if (!raw) return fallback;
    try {
      return typeof raw === "string" ? JSON.parse(raw) : raw;
    } catch (error) {
      return fallback;
    }
  }

  function formatRange(start, end) {
    if (!start && !end) return "—";
    const startDate = start ? new Date(start) : null;
    const endDate = end ? new Date(end) : null;
    const startStr = startDate
      ? startDate.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })
      : "";
    const endStr = endDate
      ? endDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      : "";
    return `${startStr} – ${endStr}`.trim();
  }

  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatCurrency(value) {
    return new Intl.NumberFormat(undefined, {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 2,
    }).format(Number(value) || 0);
  }

  function combineDateTime(dateStr, timeStr) {
    if (!dateStr || !timeStr) return "";
    const date = new Date(`${dateStr}T${timeStr}`);
    if (Number.isNaN(date.getTime())) return "";
    return date.toISOString();
  }

  function buildLocalTaskFromPayload(payload) {
    const date = payload.date || payload.startDate || formatISODate(new Date());
    return {
      id: `${TEMP_TASK_PREFIX}${Date.now()}${Math.random().toString(16).slice(2)}`,
      title: payload.title || "Untitled task",
      description: payload.description || "",
      category: payload.category || "",
      status: payload.status || "Planned",
      start: combineDateTime(date, payload.startTime),
      end: combineDateTime(payload.endDate || date, payload.endTime),
      calendarEventId: "",
    };
  }

  function addLocalTask(task) {
    state.tasks = [...state.tasks, task].sort(sortTasksByStart);
    renderTasks();
    renderKanban();
    updateDashboard();
    return task;
  }

  function removeLocalTaskById(id) {
    const initialLength = state.tasks.length;
    state.tasks = state.tasks.filter((task) => String(task.id) !== String(id));
    if (state.tasks.length !== initialLength) {
      renderTasks();
      renderKanban();
      updateDashboard();
    }
  }

  function sortTasksByStart(a, b) {
    if (!a.start || !b.start) return 0;
    return new Date(a.start) - new Date(b.start);
  }

  function applyTaskStatusLocally(id, newStatus) {
    const normalizedId = String(id);
    const task = state.tasks.find((item) => String(item.id) === normalizedId);
    if (!task) {
      return { shouldSync: true, rollback: () => {} };
    }
    const previousStatus = task.status || "Planned";
    if (previousStatus === newStatus) {
      return { shouldSync: false, rollback: () => {} };
    }
    task.status = newStatus;
    renderTasks();
    renderKanban();
    updateDashboard();
    return {
      shouldSync: true,
      rollback: () => {
        task.status = previousStatus;
        renderTasks();
        renderKanban();
        updateDashboard();
      },
    };
  }

  function buildCalendarEventUrl(eventId) {
    if (!eventId) return "";
    return `https://calendar.google.com/calendar/u/0/r/eventedit/${encodeURIComponent(eventId)}`;
  }

  function startStatusAction(targetId, initialMessage) {
    setStatus(targetId, initialMessage);
    return (message, isError = false) => setStatus(targetId, message, isError);
  }

  function setStatus(id, message, isError = false) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = message;
    el.classList.toggle("error", Boolean(isError));
    if (!message) return;
    setTimeout(() => {
      if (el.textContent === message) {
        el.textContent = "";
        el.classList.remove("error");
      }
    }, 3000);
  }

  window.deleteTask = deleteTask;
  window.deleteFinanceEntry = deleteFinanceEntry;
</script>
