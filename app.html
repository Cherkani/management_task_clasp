<script>
  function formatISODate(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    return d.toISOString().split("T")[0];
  }

  function startOfWeek(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = (day + 6) % 7;
    d.setDate(d.getDate() - diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function endOfWeek(date) {
    const d = new Date(date);
    d.setDate(d.getDate() + 6);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function addDays(date, amount) {
    const d = new Date(date);
    d.setDate(d.getDate() + amount);
    return d;
  }

  const initialWeekStart = startOfWeek(new Date());
  const initialWeekEnd = endOfWeek(initialWeekStart);

  const state = {
    panel: "dashboard",
    weekStart: initialWeekStart,
    weekEnd: initialWeekEnd,
    selectedDate: formatISODate(initialWeekStart),
    tasks: [],
    calendar: [],
    finance: [],
  };
  let taskLoaderCount = 0;
  const STATUS_ACCENTS = {
    Planned: {
      chip: "border-sky-200 bg-sky-50 text-sky-700",
      cardBorder: "border-sky-100",
      cardBg: "from-sky-50/80 to-white",
      label: "text-sky-600",
    },
    Running: {
      chip: "border-amber-200 bg-amber-50 text-amber-700",
      cardBorder: "border-amber-100",
      cardBg: "from-amber-50/80 to-white",
      label: "text-amber-600",
    },
    Done: {
      chip: "border-emerald-200 bg-emerald-50 text-emerald-700",
      cardBorder: "border-emerald-100",
      cardBg: "from-emerald-50/80 to-white",
      label: "text-emerald-600",
    },
  };

  document.addEventListener("DOMContentLoaded", () => {
    populateWeekSelector();
    setupNav();
    setupForms();
    initKanbanDroppers();
    setFormDefaults();
    refreshTasks();
    refreshFinance();
  });

  function setupNav() {
    document.querySelectorAll("nav a[data-panel]").forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        setPanel(link.dataset.panel);
      });
    });
  }

  function setPanel(panel) {
    state.panel = panel;
    document.querySelectorAll("nav a[data-panel]").forEach((link) => {
      link.classList.toggle("active", link.dataset.panel === panel);
    });
    document.querySelectorAll(".panel").forEach((section) => {
      section.classList.toggle("active", section.dataset.panel === panel);
    });
  }

  function setupForms() {
    const dateFilter = document.getElementById("taskDateFilter");
    if (dateFilter) {
      dateFilter.value = state.selectedDate;
      dateFilter.addEventListener("change", (event) => {
        const value = event.target.value || state.selectedDate;
        updateSelectedDate(value);
      });
    }

    const taskForm = document.getElementById("taskForm");
    taskForm?.addEventListener("submit", (event) => {
      event.preventDefault();
      const payload = {
        title: taskForm.title.value,
        category: taskForm.category.value,
        description: taskForm.description.value,
        date: taskForm.date.value,
        startTime: taskForm.start.value,
        endTime: taskForm.end.value,
      };
      const recurrence = taskForm.recurrence.value;
      const occurrences = Number(taskForm.occurrences.value || 1);
      setStatus("taskStatus", "Saving…");
      const runner = google.script.run
        .withSuccessHandler(() => {
          setStatus("taskStatus", "Task saved.");
          taskForm.reset();
          taskForm.date.value = state.selectedDate;
          refreshTasks();
        })
        .withFailureHandler((error) =>
          setStatus("taskStatus", error.message || "Unable to save task", true)
        );
      if (recurrence && recurrence !== "none") {
        runner.scheduleRecurringTasks({
          ...payload,
          frequency: recurrence,
          occurrences,
        });
      } else {
        runner.scheduleTask(payload);
      }
    });

    const financeForm = document.getElementById("financeForm");
    financeForm?.addEventListener("submit", (event) => {
      event.preventDefault();
      const payload = {
        date: financeForm.date.value,
        type: financeForm.type.value,
        category: financeForm.category.value,
        description: financeForm.description.value,
        amount: financeForm.amount.value,
      };
      setStatus("financeStatus", "Saving entry…");
      google.script.run
        .withSuccessHandler(() => {
          setStatus("financeStatus", "Entry logged.");
          financeForm.reset();
          refreshFinance();
        })
        .withFailureHandler((error) =>
          setStatus("financeStatus", error.message || "Unable to save entry", true)
        )
        .addFinanceEntry(payload);
    });
  }

  function populateWeekSelector() {
    const select = document.getElementById("weekSelector");
    if (!select) return;
    const options = [-1, 0, 1].map((offset) => {
      const base = addDays(new Date(), offset * 7);
      const start = startOfWeek(base);
      const end = endOfWeek(start);
      return {
        value: formatISODate(start),
        label: `${start.toLocaleDateString()} - ${end.toLocaleDateString()}`,
      };
    });
    select.innerHTML = options
      .map(
        (opt) => `<option value="${opt.value}">${offsetLabel(opt.value, opt.label)}</option>`
      )
      .join("");
    select.value = formatISODate(state.weekStart);
    select.addEventListener("change", (event) => {
      const start = startOfWeek(new Date(event.target.value));
      setWeekRange(start);
    });
  }

  function offsetLabel(value, label) {
    const current = formatISODate(state.weekStart);
    if (value === current) return `This week (${label})`;
    const nextWeek = formatISODate(addDays(state.weekStart, 7));
    const prevWeek = formatISODate(addDays(state.weekStart, -7));
    if (value === nextWeek) return `Next week (${label})`;
    if (value === prevWeek) return `Last week (${label})`;
    return label;
  }

  function setWeekRange(startDate) {
    state.weekStart = startOfWeek(startDate);
    state.weekEnd = endOfWeek(state.weekStart);
    updateSelectedDate(formatISODate(state.weekStart));
    const selector = document.getElementById("weekSelector");
    if (selector) selector.value = formatISODate(state.weekStart);
    refreshTasks();
  }

  function updateSelectedDate(dateString) {
    state.selectedDate = dateString;
    const dateFilter = document.getElementById("taskDateFilter");
    if (dateFilter) dateFilter.value = dateString;
    setFormDefaults();
  }

  function setFormDefaults() {
    const taskForm = document.getElementById("taskForm");
    if (taskForm && !taskForm.date.value) {
      taskForm.date.value = state.selectedDate;
    }
    const financeForm = document.getElementById("financeForm");
    if (financeForm && !financeForm.date.value) {
      financeForm.date.value = formatISODate(new Date());
    }
  }

  function initKanbanDroppers() {
    document.querySelectorAll(".kanban-list").forEach((list) => {
      list.addEventListener("dragover", (evt) => evt.preventDefault());
      list.addEventListener("drop", (evt) => {
        evt.preventDefault();
        const id = evt.dataTransfer.getData("text/plain");
        const column = list.closest(".kanban-column");
        if (!id || !column) return;
        const newStatus = column.dataset.status;
        const change = applyTaskStatusLocally(id, newStatus);
        if (!change.shouldSync) return;
        setStatus("taskStatus", `Moved to ${newStatus}. Syncing…`);
        google.script.run
          .withSuccessHandler(() => {
            setStatus("taskStatus", "Status synced.");
          })
          .withFailureHandler((error) => {
            change.rollback();
            setStatus("taskStatus", error.message || "Unable to update task", true);
          })
          .updateTaskStatus({ id, status: newStatus, sheetName: "Tasks" });
      });
    });
  }

function enableKanbanDrag() {
    document.querySelectorAll(".kanban-card").forEach((card) => {
      card.addEventListener("dragstart", (evt) => {
        evt.dataTransfer.setData("text/plain", card.dataset.id);
        card.classList.add("dragging");
        const rect = card.getBoundingClientRect();
        const offsetX = rect.width / 2;
        const offsetY = rect.height / 2;
        if (evt.dataTransfer.setDragImage) {
          evt.dataTransfer.setDragImage(card, offsetX, offsetY);
        }
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
      });
    });
  }

  function refreshTasks() {
    const start = formatISODate(state.weekStart);
    const end = formatISODate(state.weekEnd);
    setTaskLoader(true);
    google.script.run
      .withSuccessHandler((raw) => {
        state.tasks = parseJson(raw);
        renderTasks();
        renderKanban();
        updateDashboard();
        setTaskLoader(false);
      })
      .withFailureHandler((error) => {
        setTaskLoader(false);
        setStatus("taskStatus", error.message || "Unable to load tasks", true);
      })
      .getScheduledTasksInRange({ startDate: start, endDate: end });

    google.script.run
      .withSuccessHandler((raw) => {
        state.calendar = parseJson(raw);
        renderCalendar();
        updateDashboard();
      })
      .withFailureHandler((error) => setStatus("taskStatus", error.message || "Unable to load calendar", true))
      .getCalendarEventsForRange({ startDate: start, endDate: end });
  }

  function refreshFinance() {
    google.script.run
      .withSuccessHandler((raw) => {
        state.finance = parseJson(raw);
        renderFinance();
        updateDashboard();
      })
      .withFailureHandler((error) =>
        setStatus("financeStatus", error.message || "Unable to load entries", true)
      )
      .getFinanceEntries();
  }

  function renderTasks() {
    const tbody = document.getElementById("taskTableBody");
    if (!tbody) return;
    if (!state.tasks.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-slate-400">No tasks for this week.</td></tr>`;
      return;
    }
    tbody.innerHTML = state.tasks
      .map(
        (task) => {
          const status = task.status || "Planned";
          const accent = getStatusAccent(status);
          return `
        <tr>
          <td class="px-4 py-4">
            <p class="font-semibold text-slate-800">${escapeHtml(task.title)}</p>
            <p class="text-xs text-slate-400">${escapeHtml(task.description || "")}</p>
          </td>
          <td class="px-4 py-4 text-sm text-slate-500">${formatRange(task.start, task.end)}</td>
          <td class="px-4 py-4">
            <span class="inline-flex items-center rounded-full border px-3 py-1 text-xs font-semibold ${accent.chip}">${escapeHtml(status)}</span>
          </td>
          <td class="px-4 py-4 text-right">
            <button type="button" class="text-sm font-medium text-rose-500 transition hover:text-rose-600" onclick="deleteTask('${task.id}')">Delete</button>
          </td>
        </tr>`;
        }
      )
      .join("");
  }

  function renderKanban() {
    const columns = {
      Planned: [],
      Running: [],
      Done: [],
    };
    state.tasks.forEach((task) => {
      const status = task.status || "Planned";
      (columns[status] || columns.Planned).push(task);
    });
    Object.entries(columns).forEach(([status, items]) => {
      const accent = getStatusAccent(status);
      const container = document.getElementById(`kanban${status}`);
      if (!container) return;
      if (!items.length) {
        container.innerHTML = `<div class="rounded-2xl border border-dashed ${accent.cardBorder} bg-white/40 p-4 text-center text-sm text-slate-400">Drop tasks here</div>`;
        return;
      }
      container.innerHTML = items
        .map(
          (task) => `
        <div class="kanban-card rounded-2xl border ${accent.cardBorder} bg-white/70 p-4 shadow-sm" draggable="true" data-id="${task.id}" data-status="${status}">
          <p class="font-semibold text-slate-800">${escapeHtml(task.title)}</p>
          <p class="text-xs text-slate-500">${formatRange(task.start, task.end)}</p>
          <p class="text-xs text-slate-400">${escapeHtml(task.description || "")}</p>
        </div>`
        )
        .join("");
    });
    enableKanbanDrag();
    renderTaskSidebar();
  }

  function renderCalendar() {
    const list = document.getElementById("calendarList");
    if (!list) return;
    if (!state.calendar.length) {
      list.innerHTML = `<li class="text-slate-400">No calendar events this week.</li>`;
      return;
    }
    list.innerHTML = state.calendar
      .map(
        (event) => `
        <li class="rounded-2xl border border-slate-100 bg-slate-50/60 p-3">
          <div class="flex items-center justify-between text-sm">
            <strong class="text-slate-800">${escapeHtml(event.title)}</strong>
            <span class="text-slate-500">${formatRange(event.start, event.end)}</span>
          </div>
          <p class="text-xs text-slate-400">${escapeHtml(event.location || "")}</p>
        </li>`
      )
      .join("");
  }

  function renderFinance() {
    const tbody = document.getElementById("financeTableBody");
    if (!tbody) return;
    if (!state.finance.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-4 text-center text-slate-400">No entries yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = state.finance
      .slice(0, 25)
      .map(
        (entry) => `
        <tr>
          <td class="px-4 py-4">${escapeHtml(entry.date || "")}</td>
          <td class="px-4 py-4">${escapeHtml(entry.type || "")}</td>
          <td class="px-4 py-4">${escapeHtml(entry.category || "")}</td>
          <td class="px-4 py-4 text-slate-500">${escapeHtml(entry.description || "")}</td>
          <td class="px-4 py-4 text-right font-semibold">${formatCurrency(entry.amount)}</td>
          <td class="px-4 py-4 text-right">
            <button type="button" class="text-sm font-medium text-rose-500 transition hover:text-rose-600" onclick="deleteFinanceEntry('${entry.id}')">Delete</button>
          </td>
        </tr>`
      )
      .join("");
  }

  function renderTaskSidebar() {
    const cards = document.getElementById("taskSidebarCards");
    const upcoming = document.getElementById("taskUpcoming");
    if (!cards || !upcoming) return;
    const statuses = ["Planned", "Running", "Done"];
    const blocks = statuses
      .map((status) => {
        const accent = getStatusAccent(status);
        const count = state.tasks.filter((task) => (task.status || "Planned") === status).length;
        return `
        <div class="rounded-2xl border ${accent.cardBorder} bg-gradient-to-br ${accent.cardBg} p-4 shadow-sm">
          <div class="text-[11px] font-semibold uppercase tracking-[0.5em] ${accent.label}">${status}</div>
          <div class="mt-2 text-3xl font-semibold text-slate-900">${count}</div>
          <p class="text-xs text-slate-500">blocks tracked</p>
        </div>`;
      })
      .join("");
    cards.innerHTML =
      blocks ||
      `<div class="rounded-2xl border border-dashed border-slate-200 p-4 text-center text-sm text-slate-400">No tasks yet.</div>`;
    const upcomingTask = getUpcomingTask();
    if (!upcomingTask) {
      upcoming.innerHTML = `<p class="text-sm text-slate-400">No blocks scheduled yet.</p>`;
      return;
    }
    const accent = getStatusAccent(upcomingTask.status || "Planned");
    upcoming.innerHTML = `
      <div class="rounded-2xl border ${accent.cardBorder} bg-gradient-to-br ${accent.cardBg} p-4">
        <p class="text-xs font-semibold uppercase tracking-[0.5em] ${accent.label}">Up next</p>
        <p class="mt-2 text-lg font-semibold text-slate-900">${escapeHtml(upcomingTask.title)}</p>
        <p class="text-sm text-slate-500">${formatRange(upcomingTask.start, upcomingTask.end)}</p>
        <p class="mt-2 text-xs text-slate-400">${escapeHtml(upcomingTask.description || "")}</p>
      </div>
    `;
  }

  function updateDashboard() {
    document.getElementById("summaryTaskCount").textContent = state.tasks.length;
    document.getElementById("summaryCalendarCount").textContent = state.calendar.length;
    const insights = calculateFinanceInsights();
    document.getElementById("summaryIncome").textContent = formatCurrency(insights.income);
    document.getElementById("summaryExpense").textContent = formatCurrency(insights.expense);
    document.getElementById("insightIncome").textContent = formatCurrency(insights.income);
    document.getElementById("insightExpense").textContent = formatCurrency(insights.expense);
    document.getElementById("insightTopCategory").textContent = insights.topCategory || "—";
    document.getElementById("dashboardCalendar").innerHTML =
      state.calendar
        .slice(0, 5)
        .map(
          (event) => `
          <li>
            <div class="flex items-center justify-between text-sm">
              <strong class="text-slate-800">${escapeHtml(event.title)}</strong>
              <span class="text-slate-500">${formatRange(event.start, event.end)}</span>
            </div>
          </li>`
        )
        .join("") || '<li class="text-slate-400">No upcoming events.</li>';
    document.getElementById("dashboardFinance").innerHTML =
      state.finance
        .slice(0, 5)
        .map(
          (entry) => `
          <li>
            <div class="flex items-center justify-between text-sm">
              <strong class="text-slate-800">${escapeHtml(entry.category || entry.type || "")}</strong>
              <span class="text-slate-500">${formatCurrency(entry.amount)}</span>
            </div>
          </li>`
        )
        .join("") || '<li class="text-slate-400">No recent entries.</li>';
  }

  function getUpcomingTask() {
    if (!state.tasks.length) return null;
    const withDates = state.tasks.filter((task) => task.start);
    if (!withDates.length) return null;
    const sorted = [...withDates].sort((a, b) => new Date(a.start) - new Date(b.start));
    const future = sorted.find((task) => new Date(task.start) >= new Date());
    return future || sorted[0] || null;
  }

  function calculateFinanceInsights() {
    const totals = {};
    let income = 0;
    let expense = 0;
    state.finance.forEach((entry) => {
      const bucket = entry.type === "Income" ? "Income" : "Expense";
      const amount = Number(entry.amount || 0);
      const key = entry.category || bucket;
      totals[key] = (totals[key] || 0) + amount;
      if (bucket === "Income") income += amount;
      else expense += amount;
    });
    const topCategory = Object.entries(totals).sort((a, b) => b[1] - a[1])[0]?.[0];
    return { income, expense, topCategory };
  }

  function deleteTask(id) {
    if (!id) return;
    setStatus("taskStatus", "Removing task…");
    google.script.run
      .withSuccessHandler(() => {
        setStatus("taskStatus", "Task removed.");
        refreshTasks();
      })
      .withFailureHandler((error) =>
        setStatus("taskStatus", error.message || "Unable to delete task", true)
      )
      .deleteTask({ id, sheetName: "Tasks" });
  }

  function deleteFinanceEntry(id) {
    if (!id) return;
    setStatus("financeStatus", "Removing entry…");
    google.script.run
      .withSuccessHandler(() => {
        setStatus("financeStatus", "Entry deleted.");
        refreshFinance();
      })
      .withFailureHandler((error) =>
        setStatus("financeStatus", error.message || "Unable to delete entry", true)
      )
      .deleteFinanceEntry(id);
  }

  function parseJson(raw, fallback = []) {
    if (!raw) return fallback;
    try {
      return typeof raw === "string" ? JSON.parse(raw) : raw;
    } catch (error) {
      return fallback;
    }
  }

  function formatRange(start, end) {
    if (!start && !end) return "—";
    const startDate = start ? new Date(start) : null;
    const endDate = end ? new Date(end) : null;
    const startStr = startDate
      ? startDate.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })
      : "";
    const endStr = endDate
      ? endDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      : "";
    return `${startStr} – ${endStr}`.trim();
  }

  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatCurrency(value) {
    return new Intl.NumberFormat(undefined, {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 2,
    }).format(Number(value) || 0);
  }

  function getStatusAccent(status = "Planned") {
    return STATUS_ACCENTS[status] || STATUS_ACCENTS.Planned;
  }

  function applyTaskStatusLocally(id, newStatus) {
    const task = state.tasks.find((item) => item.id === id);
    if (!task) {
      return {
        shouldSync: true,
        rollback: () => {},
      };
    }
    const previousStatus = task.status || "Planned";
    if (previousStatus === newStatus) {
      return {
        shouldSync: false,
        rollback: () => {},
      };
    }
    task.status = newStatus;
    renderTasks();
    renderKanban();
    updateDashboard();
    return {
      shouldSync: true,
      rollback: () => {
        task.status = previousStatus;
        renderTasks();
        renderKanban();
        updateDashboard();
      },
    };
  }

  function setTaskLoader(isStarting) {
    const loader = document.getElementById("taskLoader");
    if (!loader) return;
    taskLoaderCount = Math.max(0, taskLoaderCount + (isStarting ? 1 : -1));
    const active = taskLoaderCount > 0;
    loader.classList.toggle("hidden", !active);
    loader.classList.toggle("flex", active);
    loader.classList.toggle("pointer-events-none", !active);
    loader.classList.toggle("pointer-events-auto", active);
  }

  function setStatus(id, message, isError = false) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = message;
    el.classList.toggle("text-rose-500", Boolean(isError) && Boolean(message));
    el.classList.toggle("text-slate-400", !isError);
    if (!message) return;
    setTimeout(() => {
      if (el.textContent === message) {
        el.textContent = "";
        el.classList.remove("text-rose-500");
      }
    }, 3000);
  }

  window.deleteTask = deleteTask;
  window.deleteFinanceEntry = deleteFinanceEntry;
</script>
