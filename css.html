<style>
:root {
  --sidebar-bg: #05233b;
  --sidebar-accent: #0ea5e9;

  --sidebar-active: rgba(16, 185, 129, 0.35);
  --body-gradient: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 35%, #f3e8ff 100%);

  --card-border: rgba(15, 23, 42, 0.08);
  --shadow-1: 0 15px 45px rgba(10, 37, 64, 0.08);
  --primary: #0ea5e9;
  --primary-hover: #0369a1;
  --primary-glow: rgba(14, 165, 233, 0.35);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;

    "Helvetica Neue", Arial, sans-serif;
}

body {

  min-height: 100vh;
  background: var(--body-gradient);
  color: #04121f;
}

nav {
  position: fixed;
  left: 0;
  top: 0;
  height: 100vh;
  width: 230px;
  background: var(--sidebar-bg);
  padding: 28px 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-shadow: 20px 0 45px rgba(4, 18, 31, 0.35);
  z-index: 10;
  animation: floatIn 0.6s ease-out forwards;
}

nav::before {
  content: "TaskFlow";
  font-weight: 700;
  font-size: 1.35rem;
  color: #fff;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-align: center;
  padding: 16px;
  border-radius: 14px;
  background: linear-gradient(135deg, #14b8a6, #0ea5e9);
  box-shadow: 0 12px 30px rgba(20, 184, 166, 0.3);
}

nav ul {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

nav ul li a {
  color: #e0f2fe;
  font-size: 1rem;
  font-weight: 500;
  text-decoration: none;
  padding: 14px 18px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  overflow: hidden;
  transition: color 0.25s ease, transform 0.25s ease;
}

nav ul li a::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--sidebar-hover);
  opacity: 0;
  transition: opacity 0.25s ease;
}

nav ul li a:hover {
  color: #f0fdfa;
  transform: translateX(6px);
}

nav ul li a:hover::after {
  opacity: 1;
}

nav ul li a.active {
  background: var(--sidebar-active);
  color: #f0fdfa;
  box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
}

.app-container {
  min-height: 100vh;
  position: relative;
  padding-left: 230px;
}

.navbar {
  background: rgba(255, 255, 255, 0.85);

  padding: 18px 24px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow: var(--shadow-1);
  margin: 28px 48px 0;
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: center;
}

.content {
  margin: 0 auto;
  padding: 32px 48px 60px;

}

  flex-direction: column;

}

}

  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

}

.actions {

  justify-content: flex-end;
  margin-top: 12px;
}

.table-wrapper {

}

}

.data-table th,

.data-table th {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;

}

.align-right {

}

.table-meta {

}

}

.dashboard-list {

}

.agenda-list li,

}

}

.kanban-column {

}

.kanban-empty {

  border-radius: 12px;
  padding: 12px;
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
}

.kanban-card {
  border: 1px solid rgba(8, 47, 73, 0.15);
  border-radius: 12px;
  padding: 10px;
  background: #fff;
  box-shadow: 0 6px 20px rgba(4, 18, 31, 0.08);
  cursor: grab;
}

.kanban-card strong {
  display: block;
  margin-bottom: 4px;
}

}

.insight {

  background: rgba(248, 250, 252, 0.8);
}

.insight span {

}

.insight strong {

}

.status-text {

}

.status-text.error {

}

.form-card label span {

  color: #082f49;
}

.btn {

  padding: 12px 20px;
  font-weight: 600;
  border: none;
  background: var(--primary);

  box-shadow: 0 18px 35px var(--primary-glow);
  transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}

button:hover,
.btn:hover {

  transform: translateY(-2px);
  box-shadow: 0 22px 40px rgba(3, 105, 161, 0.45);
}

button.ghost,
.ghost {
  border-radius: 999px;
  padding: 10px 16px;
  border: 1px solid rgba(15, 23, 42, 0.1);

  box-shadow: none;
}

.ghost:hover {

}

input,
select,
textarea {

  border: 1px solid rgba(8, 47, 73, 0.12);

  transition: border 0.2s ease, box-shadow 0.2s ease;
}

input:focus,

}

    transform: translateY(12px);

  100% {

    transform: none;
